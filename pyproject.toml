[project]
name = "sharex-sync"
version = "0.1.0"
description = "Sync ShareX recording settings, hotkeys, and microphone selection across machines"
requires-python = ">=3.10"
dependencies = [
    "rich>=15.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
sharex-sync = "sharex_sync.cli:main"
# ShareX itself ships no CLI, so this name is free - claim it as the short alias.
sharex = "sharex_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharex_sync"]
